- name: Platform \ Infra Init
  commands:
    - command: rm -rf testbeds/infra-init/apps testbeds/infra-init/defaults.lua testbeds/infra-init/platform.toml testbeds/infra-init/platform testbeds/infra-init/k8s
      checks:
        - name: exitcode
          data:
            - "0"
        - name: ./testbeds/infra-init/platform.toml
          data: []
    - command: ALWAYS_YES=1 ./testbed.sh infra-init init "Johnny Appleseed" "john@apple.com" "prod9/infra-new"
      checks:
        - name: exitcode
          data:
            - "0"
        - name: ./testbeds/infra-init/platform.toml
          data:
            - '-----BEGIN platform.toml-----'
            - maintainer = "Johnny Appleseed <john@apple.com>"
            - repository = "prod9/infra-new"
            - local_arch = "auto"
            - publish_arch = "amd64"
            - strategy = "rolling"
            - excludes = ["*.docker", "*.local", ".dockerignore", ".git", ".github", ".gitignore", ".idea", ".svelte-kit", ".vscode", "build", "dist", "node_modules", "platform.toml", "target"]
            - ""
            - '[modules]'
            - '  [modules.infra-init]'
            - '    workdir = "."'
            - '    timeout = "1m0s"'
            - '    framework = "platform/infra"'
            - '    port = 0'
            - '-----END platform.toml-----'
            - ""
- name: Platform \ Infra Init Launcher
  commands:
    - command: sh ./testbeds/check-launcher.sh
      checks:
        - name: exitcode
          data:
            - "0"
        - name: stdout
          data:
            - '#!/bin/sh'
            - set -e
            - ""
            - PLATFORM_MODULE="platform.prodigy9.co"
            - PLATFORM_VERSION="<verified-build-version>"
            - ""
            - bindir="$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd)/bin"
            - bin="$bindir/platform-$PLATFORM_VERSION"
            - ""
            - if [ ! -x "$bin" ]; then
            - '    echo "platform: installing $PLATFORM_VERSION (cold compile may take minutes)..." >&2'
            - '    mkdir -p "$bindir"'
            - '    printf ''*\n'' > "$bindir/.gitignore"'
            - '    GOBIN="$bindir" go install "$PLATFORM_MODULE@$PLATFORM_VERSION"'
            - '    mv "$bindir/$PLATFORM_MODULE" "$bin"'
            - fi
            - ""
            - exec "$bin" "$@"
- name: Platform \ Infra Init Render
  commands:
    - command: ./testbed.sh infra-init render
      checks:
        - name: exitcode
          data:
            - "0"
- name: Platform \ Render
  commands:
    - command: ./testbed.sh infra-basic render
      checks:
        - name: exitcode
          data:
            - "0"
        - name: stdout
          data:
            - k8s/infra-basic/objects.yaml
            - k8s/infra-basic/route.yaml
        - name: ./testbeds/infra-basic/k8s/infra-basic/*.yaml
          data:
            - '-----BEGIN objects.yaml-----'
            - 'apiVersion: v1'
            - 'kind: Namespace'
            - 'metadata:'
            - '    name: infra-basic'
            - '---'
            - 'apiVersion: apps/v1'
            - 'kind: Deployment'
            - 'metadata:'
            - '    labels:'
            - '        app: infra-basic'
            - '    name: infra-basic'
            - '    namespace: infra-basic'
            - 'spec:'
            - '    replicas: 1'
            - '    selector:'
            - '        matchLabels:'
            - '            app: infra-basic'
            - '    template:'
            - '        metadata:'
            - '            labels:'
            - '                app: infra-basic'
            - '        spec:'
            - '            containers:'
            - '                - image: ghcr.io/prod9/infra-basic:v1.0.0'
            - '                  name: infra-basic'
            - '                  ports:'
            - '                    - containerPort: 8080'
            - '---'
            - 'apiVersion: v1'
            - 'kind: Service'
            - 'metadata:'
            - '    name: infra-basic'
            - '    namespace: infra-basic'
            - 'spec:'
            - '    ports:'
            - '        - port: 80'
            - '          targetPort: 8080'
            - '    selector:'
            - '        app: infra-basic'
            - '-----END objects.yaml-----'
            - ""
            - '-----BEGIN route.yaml-----'
            - 'apiVersion: gateway.networking.k8s.io/v1'
            - 'kind: HTTPRoute'
            - 'metadata:'
            - '    name: infra-basic'
            - '    namespace: infra-basic'
            - 'spec:'
            - '    hostnames:'
            - '        - basic.smoke.test'
            - '    parentRefs:'
            - '        - name: infra-basic-gateway'
            - '    rules:'
            - '        - backendRefs:'
            - '            - name: infra-basic'
            - '              port: 80'
            - '-----END route.yaml-----'
            - ""
- name: Platform \ Infra Build
  commands:
    - command: ./testbed.sh infra-basic -q build
      checks:
        - name: exitcode
          data:
            - "0"
