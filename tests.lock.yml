- name: Platform \ Platform
  commands:
    - command: go build -v -o ./bin/platform .
      checks:
        - name: exitcode
          data:
            - "0"
- name: Platform \ Release
  commands:
    - command: sh ./testbeds/release/test.sh
      checks:
        - name: exitcode
          data:
            - "0"
        - name: stdout
          data:
            - 'malformed: rejected before fetch'
            - 'shorthand: rejected before fetch'
            - 'metadata: rejected before fetch'
            - 'extra-argument: rejected before fetch'
            - 'name-and-patch: rejected before fetch'
            - 'name-and-false-patch: rejected before fetch'
            - 'conflicting-false-bumps: rejected before fetch'
            - 'unsupported-strategy: rejected before fetch'
            - 'v1.2.3-alpha.1: annotated tag pushed to local remote'
            - 'v1.2.3-beta.2: annotated tag pushed to local remote'
            - 'v1.2.3: annotated tag pushed to local remote'
            - 'v1.2.4: annotated tag pushed to local remote'
            - 'collision: rejected; local and remote tags unchanged'
            - ""
            - 'Alpha annotation:'
            - v1.2.3-alpha.1
            - ""
            - '* [2ac4bee][https://github.com/example/release-fixture/commit/2ac4bee] fixture: SemVer strategy'
            - '* [0ed2bd4][https://github.com/example/release-fixture/commit/0ed2bd4] fixture: Date strategy'
            - '* [4121cc5][https://github.com/example/release-fixture/commit/4121cc5] fixture: Initial project'
            - ""
            - 'Remote tags:'
            - v1.2.3 tag
            - v1.2.3-alpha.1 tag
            - v1.2.3-beta.2 tag
            - v1.2.4 tag
- name: Platform \ Build Missing Module
  commands:
    - command: ./bin/platform -f testbeds/gobasic/platform.toml build missing-module
      checks:
        - name: exitcode
          data:
            - "1"
        - name: stderr
          data:
            - INF started obj=missing-module
            - INF started obj=missing-module/config
            - 'ERR missing-module: invalid module err="missing-module: invalid module"'
            - 'ERR missing-module: invalid module err="missing-module: invalid module"'
            - INF done obj=main
- name: Platform \ Go Basic \ Init
  commands:
    - command: ./testbed.sh gobasic init "Johnny Appleseed" "john@apple.com" "github.com/prod9/platform"
      checks:
        - name: ./testbeds/gobasic/platform.toml
          data:
            - '-----BEGIN platform.toml-----'
            - maintainer = "Johnny Appleseed <john@apple.com>"
            - platform = "auto"
            - repository = "github.com/prod9/platform"
            - strategy = "timestamp"
            - excludes = ["*.docker", "*.local", ".dockerignore", ".git", ".github", ".gitignore", ".idea", ".svelte-kit", ".vscode", "build", "deploy", "dist", "node_modules", "platform.toml", "target"]
            - ""
            - '[modules]'
            - '  [modules.gobasic]'
            - '    workdir = "."'
            - '    timeout = "1m0s"'
            - '    framework = "go/basic"'
            - '-----END platform.toml-----'
            - ""
        - name: ./testbeds/gobasic/platform
          data:
            - '-----BEGIN platform-----'
            - '#!/bin/sh'
            - ""
            - PLATFORM_VERSION="v0.8.1"
            - ""
            - go run "platform.prodigy9.co@$PLATFORM_VERSION" "$@"
            - '-----END platform-----'
            - ""
- name: Platform \ Go Basic \ Build
  commands:
    - command: ./testbed.sh gobasic -q build
      checks:
        - name: exitcode
          data:
